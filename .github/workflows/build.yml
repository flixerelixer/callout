name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = python -c "import callout; print(callout.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match version $v in callout/__init__.py" }

      - name: Unit tests
        run: python -m pytest -q

      - name: Build the app
        run: pyinstaller callout.spec --noconfirm

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $env:CALLOUT_HOME = "$env:RUNNER_TEMP\callout-home"
          $p = Start-Process -FilePath "dist\Callout\Callout.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:CALLOUT_HOME\logs\callout.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Test the self-updater script
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\updtest"
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item dist\Callout "$t\install" -Recurse
          New-Item -ItemType Directory -Force "$t\new" | Out-Null
          Copy-Item dist\Callout "$t\new\Callout" -Recurse
          "new version" | Out-File "$t\new\Callout\_internal\marker.txt"
          python -c "import sys; from callout.updater import UPDATE_SCRIPT; open(sys.argv[1], 'w', encoding='utf-8').write(UPDATE_SCRIPT)" "$t\apply.ps1"
          $app = Start-Process -FilePath powershell -ArgumentList "-NoProfile","-Command","Start-Sleep 3" -WindowStyle Hidden -PassThru
          powershell -NoProfile -ExecutionPolicy Bypass -File "$t\apply.ps1" -AppPid $app.Id -Install "$t\install" -New "$t\new\Callout" -Log "$t\update.log" -NoRestart
          Get-Content "$t\update.log"
          if (-not (Test-Path "$t\install\_internal\marker.txt")) { throw "The update was not applied" }
          if (Test-Path "$t\install\_internal.old") { throw "The backup was not cleaned up" }
          if (-not (Test-Path "$t\install\Callout.exe")) { throw "Callout.exe is missing after the update" }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$("${{ github.sha }}".Substring(0,7))" }
          $name = "Callout-$version-win64.zip"
          Compress-Archive -Path dist\Callout -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Callout-win64
          path: ${{ steps.zip.outputs.name }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
