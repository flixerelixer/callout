name: Website

# Publishes site/ to GitHub Pages (fragsubs.com).
# One-time setup in the repo: Settings > Pages > Source: GitHub Actions,
# and Custom domain: fragsubs.com.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers keep style.css and app.js for a while. Give each a version
      # that changes with its content, so a new page never gets old styles.
      - name: Version the CSS and JS links
        run: |
          for f in style.css app.js; do
            v=$(sha256sum "site/$f" | cut -c1-10)
            sed -i "s|\"$f\"|\"$f?v=$v\"|g" site/index.html
          done
          grep -c '?v=' site/index.html | grep -qx 2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
